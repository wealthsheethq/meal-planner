<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kitchen Display</title>
  <meta name="description" content="An always-on kitchen wall display for Meal Planner: tonight's dinner, groceries, the week, weather and countdowns.">
  <meta name="theme-color" content="#FAF6EE">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kitchen">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="../icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="display.css">
  <script>
    try { var t = localStorage.getItem('mp:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../js/display.js"></script>
</head>
<body class="kd-body">
  <div id="app"></div>
  <noscript><p style="padding:24px;font-family:system-ui">The kitchen display needs JavaScript turned on.</p></noscript>
</body>
</html>
